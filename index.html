<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="dashboard">
        <h1>Weather Dashboard</h1>
        <p>Search for a city to discover its current weather.</p>

        <form id="searchForm">
            <label for="cityInput">Enter a city name:</label>
            <input type="text" id="cityInput" required>
            <button type="submit">Search</button>
        </form>

        <p id="loadingMessage"></p>
        <p id="errorMessage"></p>

        <section id="weatherResult">
            <h2 id="cityName"></h2>

            <div class="current-weather">
                <p id="weatherIcon"></p>
                <p id="temperature"></p>
                <p id="conditions"></p>
            </div>

            <div class="weather-details">
                <p id="feelsLike">Feels like: </p>
                <p id="humidity">Humidity: </p>
                <p id="windSpeed">Wind speed: </p>
            </div>
        </section>
    </main>

</body>

</html>
